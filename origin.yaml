port: 7890
socks-port: 7891
mixed-port: 7892
allow-lan: true
bind-address: '*'
mode: rule
log-level: warning
ipv6: false
external-controller: 0.0.0.0:9090
unified-delay: true
tcp-concurrent: true
global-client-fingerprint: chrome
find-process-mode: strict
ntp:
  enable: true
  write-to-system: false
  server: ntp.aliyun.com
  port: 123
  interval: 30
sniffer:
  enable: true
  parse-pure-ip: true
  force-dns-mapping: false
  override-destination: true
  sniff:
    TLS:
      ports:
      - 443
      - 8443
    HTTP:
      ports:
      - 80
      - 8080-8880
    QUIC:
      ports:
      - 443
dns:
  enable: true
  listen: :1053
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  proxy-server-nameserver:
  - https://223.5.5.5/dns-query
  nameserver:
  - https://223.5.5.5/dns-query
  - https://doh.pub/dns-query
  fallback:
  - https://1.1.1.1/dns-query
  - https://8.8.8.8/dns-query
  fallback-filter:
    geoip: true
    geoip-code: CN
    ipmask:
    - 240.0.0.0/4
  fake-ip-filter:
  - tplinkwifi.net
  - miwifi.com
  - router.asus.com
  - +.lan
  - localhost.ptlogin2.qq.com
  - geoip:private
  - geoip:cn
tun:
  enable: true
  stack: mixed
  auto-route: true
  auto-detect-interface: true
  strict-route: true
  dns-hijack:
  - any:53
  device: SakuraiTunnel
  mtu: 1500
  endpoint-independent-nat: true
proxies:  # 这里的内容会被替换
  - name: "example"
    type: "ss"
    server: "example.com"
    port: 443
    cipher: "aes-256-gcm"
    password: "password"
    udp: true
proxy-groups:
  - name: ✅节点选择
    type: select
    proxies:
      - ♻️自动切换
      - DIRECT
  - name: 🤖AI
    type: select
    proxies:
  - name: 🎧Spotify
    type: select
    proxies:
      - ♻️自动切换
  - name: Ⓜ️微软服务
    type: select
    proxies:
      - 🔗直连
      - ✅节点选择
  - name: 🍎苹果
    type: select
    proxies:
      - 🔗直连
      - ✅节点选择
  - name: 🅰️Adobe
    type: select
    proxies:
      - REJECT
      - DIRECT
      - ✅节点选择 
  - name: ♻️自动切换
    type: url-test
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    proxies:
  - name: 🔗直连
    type: select
    proxies:
      - DIRECT
      - ✅节点选择
  - name: ⛔拦截
    type: select
    proxies:
      - REJECT
      - DIRECT
      - ✅节点选择
  - name: 中转
    type: select
    proxies:
      - ✅节点选择
      - 🔗直连
geox-url:
  geosite: https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat@release/geosite.dat
  geoip: https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat@release/geoip.dat
  mmdb: https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat@release/country.mmdb
geodata-mode: true
# 1. 声明规则集 (Rule Providers)
rule-providers:
  # 专门拦截 Spotify 广告的规则集
  spotify_ads:
    type: http
    behavior: domain
    url: "https://cdn.jsdelivr.net/gh/Blackmatrix7/ios_rule_script@master/rule/Clash/Spotify/Spotify.yaml"
    path: ./rules/spotify_ads.yaml
    interval: 86400

  # 通用广告拦截规则集
  advertising:
    type: http
    behavior: domain
    url: "https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/reject.txt"
    path: ./rules/reject.yaml
    interval: 86400
rules:
  # 1. 本地与局域网直连
  - DOMAIN-SUFFIX,local,🔗直连
  - DOMAIN-SUFFIX,localhost,🔗直连
  - IP-CIDR,192.168.0.0/16,🔗直连
  - IP-CIDR,10.0.0.0/8,🔗直连
  - IP-CIDR,127.0.0.0/8,🔗直连
  - IP-CIDR,100.64.0.0/10,🔗直连

  # 2. 广告拦截
  - RULE-SET,spotify_ads,REJECT
  - RULE-SET,advertising,REJECT
  - GEOSITE,category-ads-all,⛔拦截

  # 3. 音乐与滚动歌词
